:root{--bg:#0e0b14;--card:#1a1524;--line:#33294a;--tx:#f1ebff;--mu:#a597c4;--gold:#e8b84a;--ac:#8b5cf6;--red:#ef5b5b;--ok:#4ade80;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f6f2fc;--card:#fff;--line:#ddd2f0;--tx:#201838;--mu:#6b5e8a;--gold:#a87a10}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:'Cairo',Tahoma,sans-serif;line-height:1.6}
.wrap{max-width:900px;margin:0 auto;padding:14px}
h1,h2,h3{margin:0}
.btn{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:8px 14px;font:inherit;font-weight:600;cursor:pointer}
.btn.g{background:transparent;border:1px solid var(--line);color:var(--tx)}
.btn.r{background:var(--red)}
.btn.s{padding:4px 10px;font-size:.85rem}
.btn:disabled{opacity:.4;cursor:default}
input,select,textarea{width:100%;background:var(--bg);color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:9px;font:inherit;margin:4px 0 10px}
label{font-size:.85rem;color:var(--mu)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.badge{background:var(--card);border:1px solid var(--gold);color:var(--gold);border-radius:20px;padding:2px 12px;font-size:.85rem}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;padding-bottom:4px}
.tabs button{white-space:nowrap}
.tabs .on{background:var(--gold);color:#1a1208;border-color:var(--gold)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.row{display:flex;justify-content:space-between;gap:8px;padding:2px 0}
.row span:first-child{color:var(--mu)}
.bar{height:6px;background:var(--line);border-radius:4px;overflow:hidden;margin:2px 0 6px}
.bar i{display:block;height:100%;background:var(--ac)}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.center{max-width:380px;margin:12vh auto;text-align:center}
#m{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;padding:14px;z-index:9}
#m>div{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:0;width:100%;max-width:400px;max-height:90vh;max-height:88dvh;overflow:hidden;display:flex;flex-direction:column}
#m .mbody{padding:18px 18px 12px;overflow:auto;flex:1 1 auto;min-height:0;-webkit-overflow-scrolling:touch}
#t{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--card);border:1px solid var(--gold);padding:8px 18px;border-radius:20px;display:none;z-index:10}
.mu{color:var(--mu);font-size:.85rem}
#m .macts{flex:none;margin:0;padding:12px 18px;border-top:1px solid var(--line);background:var(--card)}

<style id="ux-layer">
/* ===== طبقة التصميم الجديدة: ألوان + حركة + تباعد (لا تغيّر أي منطق) ===== */
:root{--ac2:#ec4899;--gold2:#ffd36e;--glass:rgba(255,255,255,.05);--ok2:#22d3ee;--aur1:#8b5cf63d;--aur2:#ec489926;--aur3:#e8b84a1f;--ease:cubic-bezier(.22,1,.36,1);--glow:color-mix(in srgb,var(--ac) 55%,transparent);--bg:#0a0713;--card:#161022;--line:#34285a}
@media(prefers-color-scheme:light){:root:not([data-theme="dark"]){--glass:rgba(139,92,246,.07);--aur1:#8b5cf62e;--aur2:#ec489918;--aur3:#e8b84a26;--gold2:#e0a526;--bg:#f5f0ff;--line:#d9cdf2}}
body[data-world=hell]{--ac:#ff5f3d;--ac2:#ffa62b;--aur1:#ff5f3d38;--aur2:#ffa62b1f}
body[data-world=demons]{--ac:#b53dff;--ac2:#ff3d8b;--aur1:#b53dff38;--aur2:#ff3d8b22}
body[data-world=magic]{--ac:#4f7cff;--ac2:#22d3ee;--aur1:#4f7cff38;--aur2:#22d3ee22}
body[data-world=kingdom]{--ac:#14b87a;--ac2:#e8b84a;--aur1:#14b87a30;--aur2:#e8b84a24}
body[data-world=sys]{--ac:#e8b84a;--ac2:#ff8a3d;--aur1:#e8b84a2e;--aur2:#ff8a3d22}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{position:relative;min-height:100vh;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:-10%;z-index:-1;pointer-events:none;background:radial-gradient(46rem 32rem at 88% 0,var(--aur1),transparent 62%),radial-gradient(40rem 30rem at 0 18%,var(--aur2),transparent 60%),radial-gradient(36rem 26rem at 60% 105%,var(--aur3),transparent 60%);animation:aur 26s ease-in-out infinite alternate;transition:background 1s}
@keyframes aur{to{transform:translate3d(-2.5%,2%,0) scale(1.06)}}
h2{font-weight:800;letter-spacing:.2px}
/* الأزرار: تباعد + تدرج + ضغط ناعم */
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:6px;margin:4px 3px;min-height:40px;line-height:1.3;text-align:center;background:linear-gradient(135deg,var(--ac),var(--ac2));box-shadow:0 6px 16px -8px var(--glow),inset 0 1px 0 #ffffff38;touch-action:manipulation;user-select:none;-webkit-user-select:none;transition:transform .18s var(--ease),box-shadow .25s,filter .25s,border-color .25s,background-color .25s,color .25s}
.btn.s{min-height:32px;padding:5px 12px;border-radius:9px}
.btn.g{background:var(--glass);box-shadow:none;border:1px solid var(--line);color:var(--tx);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.btn.r{background:linear-gradient(135deg,#ff6b6b,#d6336c);box-shadow:0 6px 16px -8px #ef5b5b99,inset 0 1px 0 #ffffff38}
.acts>.btn,.tabs>.btn,.top>.btn,.mrow>.btn,[style*="display:flex"]>.btn,[style*="display: flex"]>.btn,[style*="display:grid"]>.btn{margin:0}
.btn:active:not(:disabled){transform:scale(.95);filter:brightness(.95)}
.btn:disabled{filter:grayscale(.7);box-shadow:none}
@media(hover:hover){.btn:hover:not(:disabled){transform:translateY(-1px);filter:brightness(1.1)}.btn.g:hover:not(:disabled){border-color:var(--ac);box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 18%,transparent)}.card:hover{border-color:color-mix(in srgb,var(--ac) 45%,var(--line))}}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.acts{gap:8px}
/* التبويبات: تمرير سلس وحواف متلاشية */

const TD7=7*864e5,TW4=['hell','demons','magic','sys'],TRW=['coins','gems','gp','xp'],TRE={coins:'💰',gems:'💎',gp:'💲',xp:'✨XP'};
const taskLv=t=>{const x=String(t.lvs||'').trim();if(!x)return null;const st=new Set();x.split(/[,،\s]+/).forEach(v=>{const m=v.match(/^(\d+)-(\d+)$/);if(m){for(let i=+m[1];i<=Math.min(+m[2],+m[1]+2000);i++)st.add(i)}else if(/^\d+$/.test(v))st.add(+v)});return st};
const taskTop=w=>{let m=0;(S.tasks||[]).forEach(t=>{if(t.type==='week'||!taskFor(t,w))return;const s=taskLv(t);if(s)s.forEach(v=>{if(v>m)m=v})});return m};
const taskOkLv=(t,p)=>{if(t.type==='week')return true;const s=taskLv(t);if(!s)return true;if(s.has(p.level))return true;const top=taskTop(p.world);return top>0&&p.level>top&&s.has(top)};
const taskExp=t=>t.type==='week'&&Date.now()>=t.t0+TD7;
const taskDone=(t,p)=>((p.td||{})[t.id]||{}).c||0;
const taskFor=(t,w)=>!t.worlds||t.worlds.includes(w);
const taskRw=t=>TRW.filter(k=>t[k]>0).map(k=>fmt(t[k])+TRE[k]).join(' + ')||'—';
const taskGrp=t=>t.type==='week'?'🗓️ أسبوعية':'📅 موسمية — الموسم '+(ORD[t.season]||(+t.season+1));
const taskLeft=t=>Math.max(1,Math.ceil((t.t0+TD7-Date.now())/864e5));
const taskActive=w=>(S.tasks||[]).filter(t=>taskFor(t,w)&&!taskExp(t));
const alertM=(h,b)=>modal(h,`<p>${b}</p>`,'حسناً',closeM);
function taskGroups(L,f){const g={},o={};L.forEach(t=>{const k=taskGrp(t);o[k]=t.type==='week'?999:+t.season;(g[k]=g[k]||[]).push(t)});return Object.keys(g).sort((x,y)=>o[x]-o[y]).map(k=>`<h4 style="margin:12px 0 6px">${k}</h4>`+g[k].map(f).join('')).join('')}

function taskGo(){

 TRW.forEach(k=>{if(t[k]>0)p[k]=(p[k]||0)+t[k]});

function taskBox(p){

 const all=(S.tasks||[]).filter(t=>taskFor(t,p.world));

 const open=all.filter(t=>st(t)==='open'),lock=all.filter(t=>st(t)==='lock');
 const dn=Object.entries(p.td||{}).filter(([id,x])=>x.c>0).map(([id,x])=>{const t=all.find(z=>z.id===id);return {id,x,t,max:t?t.max:x.c}});

function parseSalaryTpl(t){
 const out=[];let cur=null;
 const em=/[\u{1F300}-\u{1FAFF}\u2600-\u27BF\uFE0F]/gu;
 t.split('\n').forEach(raw=>{
  const l=raw.trim();if(!l)return;const n=nz(l);
  const val=l.slice(l.indexOf(':')+1).trim();
  if(/^[◈•]?\s*المستفيد\s*:/.test(n)){cur={name:cleanName(val).replace(em,'').replace(/\s+/g,' ').trim(),role:'',coins:0,gems:0,gp:0,usd:0};out.push(cur);return}
  if(!cur)return;
  if(/^[◈•]?\s*المنصب\s*:/.test(n)){cur.role=cleanName(val).replace(em,'').replace(/\s+/g,' ').trim();return}
  const m=n.match(/^[◈•]?\s*قيمة\s*(الكوينز|الجواهر|الجي بي|الدولار)\s*:/);
  if(m){const k={'الكوينز':'coins','الجواهر':'gems','الجي بي':'gp','الدولار':'usd'}[m[1]];
   cur[k]=k==='usd'?(+String(val).replace(/[^\d,.]/g,'').replace(',','.')||0):(+String(val).replace(/[^\d.]/g,'')||0)}
 });
 return out.filter(q=>q.name);
}

function parseSalary(t){

  const cm={'💰':'coins','💎':'gems','💲':'gp','💸':'usd'},num=x=>+String(x).replace(/,/g,'')||0;

   if(fd>=0&&fi>=0&&fd<fi){while((m=re2.exec(l)))add(m[2],m[1])}else{while((m=re1.exec(l)))add(m[1],m[2])}

  });
 }
 return{players:pl,vault};
}

   modal('🔁 تأكيد التبادل',`<p>تبادل <b>${esc(a.name)}</b> (${n1}) مع <b>${esc(b.name)}</b> (${n2})؟</p>${xs.length?`<p>مع سعر إضافي <b>${fmx(k=>C[k][1])}</b> يدفعه عالم ${W[xw].n} إلى عالم ${W[xr].n}.</p>`:''}`,'تأكيد',()=>{

 }else{

   if(lack())return toast('خزنة عالم '+n2+' لا تكفي');
   vs.forEach(([k,v])=>{S.vaults[w2][k]-=v;S.vaults[w1][k]+=v});a.world=w2;fixRank(a);
   finishTrade(w1,w2,`💰 بيع لاعب: بيع ${a.name} من ${n1} إلى ${n2} بسعر ${fm(k=>C[k][0])} (خُصم من خزنة ${n2} وأُضيف إلى خزنة ${n1})`)});
 }
}

// ===== المزامنة السحابية (Firebase) + النسخ الاحتياطي =====
let cloud=null,pushT=null,lastRemote='',cloudReady=false,cloudStatus='';
function setCS(t){cloudStatus=t;const e=$('cs');if(e)e.textContent=t}
function cloudPart(){const c={...S};delete c.undo;return JSON.stringify(c)}
function cloudPush(){if(!cloud||!cloudReady)return;clearTimeout(pushT);pushT=setTimeout(()=>{pushT=null;const j=cloudPart();lastRemote=j;cloud.set({json:j,t:Date.now()}).then(()=>setCS('\u2601\ufe0f \u0645\u062a\u0635\u0644')).catch(e=>{console.error(e);setCS('\u26a0\ufe0f \u0641\u0634\u0644 \u0627\u0644\u062d\u0641\u0638 \u0641\u064a \u0627\u0644\u0633\u062d\u0627\u0628\u0629: '+(e.code||e.message));toast('\u26a0\ufe0f \u0644\u0645 \u064a\u064f\u062d\u0641\u0638 \u0641\u064a \u0627\u0644\u0633\u062d\u0627\u0628\u0629')})},400)}
function fixS(){lvInit();S.undo=S.undo||{};S.undo.pl=S.undo.pl||{};['hell','demons','magic','sys','kingdom'].forEach(w=>{S.undo[w]=S.undo[w]||[]});S.vaults.sys=S.vaults.sys||{coins:0,gems:0,gp:0};S.vaults.kingdom=S.vaults.kingdom||{coins:0,gems:0,gp:0};S.dests=S.dests||[{n:'\u0627\u0644\u0645\u0645\u0644\u0643\u0629',price:10000}]}
function safeRender(){const ae=document.activeElement,tg=ae?ae.tagName:'';
 if(tg==='SELECT'||(tg==='INPUT'&&/^(checkbox|radio|button|submit|range|file)$/i.test(ae.type||'')))try{ae.blur()}catch(e){}
 if($('m').style.display==='flex'||/INPUT|TEXTAREA|SELECT/.test((document.activeElement||{}).tagName||'')){clearTimeout(safeRender.t);safeRender.t=setTimeout(safeRender,2500);return}render()}
function reconcile(d,s){
 const isO=v=>v&&typeof v==='object'&&!Array.isArray(v);
 if(Array.isArray(d)&&Array.isArray(s)){
  const byId=new Map();d.forEach(x=>{if(isO(x)&&x.id!=null)byId.set(x.id,x)});
  const out=s.map((x,i)=>{
   if(isO(x)&&x.id!=null&&byId.has(x.id)){const o=byId.get(x.id);byId.delete(x.id);return reconcile(o,x)}
   if(isO(x)&&x.id==null&&isO(d[i])&&d[i].id==null)return reconcile(d[i],x);
   return x});
  d.length=0;out.forEach(x=>d.push(x));return d}
 if(isO(d)&&isO(s)){
  Object.keys(d).forEach(k=>{if(!(k in s))delete d[k]});
  Object.keys(s).forEach(k=>{const a=d[k],b=s[k];d[k]=(a&&b&&typeof a==='object'&&typeof b==='object'&&Array.isArray(a)===Array.isArray(b))?reconcile(a,b):b});
  return d}
 return s}
/* التحديث السحابي يُدمج في كائنات الحالة نفسها (لا يستبدلها) حتى لا تصبح المراجع المحفوظة في نوافذ التأكيد قديمة فتضيع العملية */
function applyRemote(j){const u=S.undo,n=JSON.parse(j);delete S.undo;delete n.undo;reconcile(S,n);S.undo=u;fixS();snap();try{localStorage.setItem('og_data',JSON.stringify(S))}catch(e){}safeRender();lodgeTick()}
function backup(){const b=new Blob([cloudPart()],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='origins-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click()}
function restore(f){if(!f)return;const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);if(!o.roles||!o.players)throw 0;const u=S.undo,oc=S.roles.owner;if(kind()!=='owner')o.roles.owner=oc;S=o;S.undo=u;fixS();snap();save();render();toast('\u062a\u0645\u062a \u0627\u0644\u0627\u0633\u062a\u0639\u0627\u062f\u0629')}catch(e){toast('\u0645\u0644\u0641 \u063a\u064a\u0631 \u0635\u0627\u0644\u062d')}};r.readAsText(f)}
if(window.firebase&&window.FIREBASE_CONFIG&&FIREBASE_CONFIG.apiKey){
 try{
  firebase.initializeApp(FIREBASE_CONFIG);
  const ref=firebase.firestore().collection('app').doc('state');
  cloudStatus='\u23f3 \u062c\u0627\u0631\u064d \u0627\u0644\u0627\u062a\u0635\u0627\u0644 \u0628\u0627\u0644\u0633\u062d\u0627\u0628\u0629...';
  ref.onSnapshot(sn=>{
   if(sn.metadata.fromCache&&!cloudReady&&!sn.exists)return;
   setCS('\u2601\ufe0f \u0645\u062a\u0635\u0644');
   if(sn.metadata.hasPendingWrites||pushT)return;
   if(!sn.exists){
    if(!cloudReady){cloudReady=true;S={roles:{},players:[],vaults:{hell:{coins:0,gems:0,gp:0},demons:{coins:0,gems:0,gp:0},magic:{coins:0,gems:0,gp:0}},log:[],undo:S.undo};fixS();snap();render()}
    return}
   const j=sn.data().json;cloudReady=true;if(lastRemote&&j===lastRemote)return;lastRemote=j;applyRemote(j)
  },e=>{console.error(e);setCS('\u26a0\ufe0f \u062e\u0637\u0623 \u0641\u064a \u0627\u0644\u0627\u062a\u0635\u0627\u0644: '+(e.code||e.message)+' \u2014 \u062a\u062d\u0642\u0642 \u0645\u0646 \u0646\u0634\u0631 \u0627\u0644\u0642\u0648\u0627\u0639\u062f \u0648\u0635\u062d\u0629 \u0625\u0639\u062f\u0627\u062f\u0627\u062a Firebase');render()});
  cloud=ref;
 }catch(e){console.error(e);cloudStatus='\u26a0\ufe0f \u062e\u0637\u0623: '+e.message}
}
if(!cloud&&!cloudStatus)cloudStatus='\u26a0\ufe0f \u0648\u0636\u0639 \u0645\u062d\u0644\u064a: \u0625\u0639\u062f\u0627\u062f\u0627\u062a Firebase \u063a\u064a\u0631 \u0645\u0643\u062a\u0645\u0644\u0629';
lodgeTick();render();
</script>

(function(){
 const EM=[[/^(حفظ|حفظ في القاموس)/,'💾'],[/^إلغاء/,'✖️'],[/^إغلاق/,'✔️'],[/^خروج/,'🚪'],[/^دخول/,'🔑'],[/^حذف/,'🗑'],[/^نسخ/,'📋'],[/^تنفيذ/,'⚡'],[/^شراء/,'🛒'],[/^صرف/,'💱'],[/^عرض وتحميل/,'🖼️'],[/^توليد كود/,'🎲'],[/^تسجيل/,'📝'],[/^تأكيد/,'✅'],[/^رجوع/,'↩️'],[/^موافق/,'👍']];
 const hasE=t=>/\p{Extended_Pictographic}/u.test(t);
 function one(b){
  if(b.dataset.em||b.childElementCount)return;b.dataset.em=1;
  const t=b.textContent.trim();if(!t||hasE(t)||t.length>26)return;
  const m=EM.find(x=>x[0].test(t));if(m)b.textContent=m[1]+' '+t;
 }
 function node(n){if(n.nodeType!==1)return;if(n.matches&&n.matches('button.btn'))one(n);if(n.querySelectorAll)n.querySelectorAll('button.btn').forEach(one)}
 new MutationObserver(ms=>{ms.forEach(m=>m.addedNodes.forEach(node))}).observe(document.body,{childList:true,subtree:true});
 document.querySelectorAll('button.btn').forEach(one);
})();
