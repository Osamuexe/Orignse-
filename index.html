<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>سجلات أوريجنس</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e0b14;--card:#1a1524;--line:#33294a;--tx:#f1ebff;--mu:#a597c4;--gold:#e8b84a;--ac:#8b5cf6;--red:#ef5b5b;--ok:#4ade80;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f6f2fc;--card:#fff;--line:#ddd2f0;--tx:#201838;--mu:#6b5e8a;--gold:#a87a10}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:'Cairo',Tahoma,sans-serif;line-height:1.6}
.wrap{max-width:900px;margin:0 auto;padding:14px}
h1,h2,h3{margin:0}
.btn{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:8px 14px;font:inherit;font-weight:600;cursor:pointer}
.btn.g{background:transparent;border:1px solid var(--line);color:var(--tx)}
.btn.r{background:var(--red)}
.btn.s{padding:4px 10px;font-size:.85rem}
.btn:disabled{opacity:.4;cursor:default}
input,select,textarea{width:100%;background:var(--bg);color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:9px;font:inherit;margin:4px 0 10px}
label{font-size:.85rem;color:var(--mu)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.badge{background:var(--card);border:1px solid var(--gold);color:var(--gold);border-radius:20px;padding:2px 12px;font-size:.85rem}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;padding-bottom:4px}
.tabs button{white-space:nowrap}
.tabs .on{background:var(--gold);color:#1a1208;border-color:var(--gold)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.row{display:flex;justify-content:space-between;gap:8px;padding:2px 0}
.row span:first-child{color:var(--mu)}
.bar{height:6px;background:var(--line);border-radius:4px;overflow:hidden;margin:2px 0 6px}
.bar i{display:block;height:100%;background:var(--ac)}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.center{max-width:380px;margin:12vh auto;text-align:center}
#m{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;padding:14px;z-index:9}
#m>div{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;width:100%;max-width:400px;max-height:90vh;overflow:auto}
#t{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--card);border:1px solid var(--gold);padding:8px 18px;border-radius:20px;display:none;z-index:10}
.mu{color:var(--mu);font-size:.85rem}
.code{font-family:monospace;letter-spacing:2px;color:var(--gold);direction:ltr;display:inline-block}
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="origins-config.js"></script>
</head>
<body>
<div class="wrap" id="app"></div>
<div id="m"><div id="mb"></div></div>
<div id="t"></div>
<script>
const W={hell:{n:'الجحيم',i:'🔥'},demons:{n:'الشياطين',i:'👹'},magic:{n:'السحر',i:'🔮'},kingdom:{n:'المملكة',i:'🏰'},sys:{n:'النظام',i:'👑'}};
const C={coins:['الكوينز','💰'],gems:['الجواهر','💎'],gp:['الجي بي','💲'],usd:['الدولار','💸']};
const K=['coins','gems','gp'];
const TW=['hell','demons','magic'];let trTo='',trMode='sell';
let S,sess,world,tab='players',okFn=null;
try{S=JSON.parse(localStorage.getItem('og_data'))}catch(e){}
S=S||{roles:{},players:[],vaults:{hell:{coins:0,gems:0,gp:0},demons:{coins:0,gems:0,gp:0},magic:{coins:0,gems:0,gp:0}},log:[]};
try{sess=localStorage.getItem('og_s')}catch(e){}
let plid;try{plid=localStorage.getItem('og_p')}catch(e){}
S.undo=S.undo||{hell:[],demons:[],magic:[]};S.undo.sys=S.undo.sys||[];S.undo.kingdom=S.undo.kingdom||[];S.vaults.sys=S.vaults.sys||{coins:0,gems:0,gp:0};S.vaults.kingdom=S.vaults.kingdom||{coins:0,gems:0,gp:0};S.dests=S.dests||[{n:'المملكة',price:10000}];
const sl=w=>JSON.stringify({players:S.players.filter(p=>p.world===w),vault:S.vaults[w],log:S.log.filter(l=>l.w===w)});
let prevSl={},noPush=false,prevP={};
const snap=()=>{Object.keys(W).forEach(w=>prevSl[w]=sl(w));pBase()};
snap();
const save=()=>{
 if(!noPush)Object.keys(W).forEach(w=>{const c=sl(w);if(c!==prevSl[w]){const h=JSON.parse(c).log[0],ph=JSON.parse(prevSl[w]).log[0];S.undo[w].push({s:prevSl[w],d:(h&&(!ph||h.t!==ph.t||h.s!==ph.s))?h.s:'تعديل في السجلات'});if(S.undo[w].length>20)S.undo[w].shift()}});
 pCapture();snap();
 try{localStorage.setItem('og_data',JSON.stringify(S))}catch(e){}
 if(typeof cloudPush==='function')cloudPush();
};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=n=>{const v=Number(n),s=Math.abs(v).toLocaleString('en-US',{maximumFractionDigits:2});return v<0?s+'-':s};
const $=id=>document.getElementById(id);
const KD=['monsterCtl','kdMerchant','resMerchant'];
const kind=()=>sess.split(':')[0], wd=()=>KD.includes(sess.split(':')[0])?'kingdom':sess.split(':')[1];
const seeAll=()=>['owner','deputyOwner'].includes(kind());
const canEdit=()=>seeAll()||['king','kingDep','monsterCtl'].includes(kind());
const canDel=()=>seeAll()||['king','kingDep'].includes(kind());
const canFill=()=>seeAll()||kind()==='king';
const label=k=>{const[a,w]=k.split(':');const n=w?W[w].n:'';return({owner:'صاحب النظام',deputyOwner:'نائب صاحب النظام',king:'ملك عالم '+n,kingDep:'نائب ملك عالم '+n,merchant:'تاجر عالم '+n,monsterCtl:'متحكم الوحوش',kdMerchant:'تاجر المملكة',resMerchant:'تاجر الموارد'})[a]};
let kSec='';
const isKdD=d=>!!(d&&(d.kingdom??d.n==='المملكة'));
const kdOK=p=>kind()==='king'?p.origin===wd():true;
const wp=()=>S.players.filter(p=>p.world===world&&(world!=='kingdom'||((kSec===''||p.origin===kSec)&&kdOK(p))));
function migrateKd(){let ch=false;S.players.forEach(p=>{if(p.traveling&&p.world!=='kingdom'&&!p.origin&&isKdD(S.dests.find(d=>d.n===p.dest))){p.origin=p.world;p.world='kingdom';ch=true}});return ch}
function toast(s){const t=$('t');t.textContent=s;t.style.display='block';setTimeout(()=>t.style.display='none',2200)}
function addLog(w,s,o){if(w==='kingdom'&&!o){const q=S.players.find(p=>p.world==='kingdom'&&s.includes(p.name));if(q)o=q.origin}S.log.unshift(Object.assign({t:new Date().toLocaleString('ar-EG'),w,by:label(sess),s},o?{o}:{}));capLog();save()}
function capLog(){const c={};S.log=S.log.filter(l=>(c[l.w]=(c[l.w]||0)+1)<=200)}
function newPid(){let c;do{c=genCode()}while(S.players.some(p=>p.pid===c));return c}
function genCode(){const a='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let c='';for(let i=0;i<8;i++)c+=a[Math.floor(Math.random()*a.length)];return c}

function modal(title,body,ok,fn){okFn=fn;$('mb').innerHTML=`<h3>${title}</h3><div style="margin-top:10px">${body}</div><div class="acts"><button class="btn" onclick="okFn&&okFn()">${ok}</button><button class="btn g" onclick="closeM()">إلغاء</button></div>`;$('m').style.display='flex'}
const closeM=()=>{$('m').style.display='none';rs0={}};

function render(){
 const A=$('app');if(cloud&&!cloudReady){A.innerHTML=`<div class="center card"><h1>\ud83d\udcdc \u0633\u062c\u0644\u0627\u062a \u0623\u0648\u0631\u064a\u062c\u0646\u0632</h1><p class="mu" id="cs">${cloudStatus}</p></div>`;return}const _e=ensureStaff()|migrateKd();if(_e||S.players.some(p=>!p.pid)){S.players.forEach(p=>{if(!p.pid)p.pid=newPid()});noPush=true;save();noPush=false}
 if(!S.roles.owner){A.innerHTML=`<div class="center card"><h1>📜 سجلات أوريجنس</h1><p class="mu" style="font-size:.75rem" id="cs">${cloudStatus}</p><p class="mu">أول دخول للموقع: أدخل كودك الخاص ليُسجَّل كود صاحب النظام</p><input id="c" type="password" placeholder="كود صاحب النظام"><button class="btn" onclick="setup()">تسجيل صاحب النظام</button></div>`;return}
 if(!sess||(!sess.startsWith('player:')&&!S.roles[sess])){sess=null;A.innerHTML=`<div class="center card"><h1>📜 سجلات أوريجنس</h1><p class="mu" style="font-size:.75rem" id="cs">${cloudStatus}</p><p class="mu">أدخل كود رتبتك أو المعرّف الخاص بك (ID) لعرض سجلك</p><input id="c" type="password" placeholder="الكود" onkeydown="if(event.key==='Enter')login()"><button class="btn" onclick="login()">دخول</button></div>`;return}
 if(sess.startsWith('player:')){const p=S.players.find(x=>x.id===plid);if(!p){logout();return}world=p.world;selP=p.id;A.innerHTML=`<div class="top"><div><h2>📜 سجلات أوريجنس</h2><span class="badge">لاعب · ${W[world].i} ${W[world].n}</span></div><button class="btn g s" onclick="logout()">خروج</button></div><div id="v"></div>`;vPlayers();return}
 if(seeAll())world=world||'hell';else if(kind()==='king'){if(world!==wd()&&world!=='kingdom')world=wd()}else world=wd();
 const tabs=[['players','👥 السجلات'],['vault','🏦 الخزنة'],['shop','🛒 الشراء'],['xch','💱 الصرف'],['pay','💵 الرواتب'],['rst','🔄 التصفير'],['trade','🤝 بيع وتبادل'],['roles','👑 الرتب والأكواد'],['mon','🐲 الوحوش'],['log','🧾 السجل']].filter(t=>t[0]!=='roles'||['owner','deputyOwner','king'].includes(kind())).filter(t=>t[0]!=='shop'||['merchant','kdMerchant','resMerchant'].includes(kind())||canEdit()).filter(t=>t[0]!=='xch'||['owner','king','deputyOwner'].includes(kind())).filter(t=>t[0]!=='pay'||['owner','deputyOwner'].includes(kind())).filter(t=>t[0]!=='rst'||['owner','deputyOwner','king'].includes(kind())).filter(t=>t[0]!=='mon'||(world==='kingdom'&&['monsterCtl','owner','deputyOwner'].includes(kind()))).filter(t=>world!=='sys'||['players','log','xch','pay','rst'].includes(t[0])).filter(t=>world!=='kingdom'||!['vault','xch','pay','rst'].includes(t[0])).filter(t=>t[0]!=='trade'||(seeAll()&&TW.includes(world)));
 A.innerHTML=`<div class="top"><div><h2>📜 سجلات أوريجنس</h2><span class="badge">${label(sess)}${(()=>{const r=S.players.find(p=>p.staff===sess);return r&&r.name!==label(sess)?' · '+esc(r.name):''})()}</span></div><div class="acts" style="margin:0">${canEdit()&&!(world==='kingdom'&&kind()==='king')?`<button class="btn g s" onclick="undoOp()" ${(S.undo[world]||[]).length?'':'disabled'}>↩️ تراجع</button>`:''}${kind()==='owner'?`<button class="btn g s" onclick="ctrlM()">⚙️ التحكم</button>`:''}<button class="btn g s" onclick="logout()">خروج</button></div></div>
 ${(seeAll()||kind()==='king')?`<div class="tabs">${(seeAll()?Object.keys(W):[wd(),'kingdom']).map(k=>`<button class="btn g ${k===world?'on':''}" onclick="world='${k}';render()">${W[k].i} ${W[k].n}</button>`).join('')}</div>`:`<h3 style="margin-bottom:10px">${W[world].i} عالم ${W[world].n}</h3>`}
 <div class="tabs">${tabs.map(t=>`<button class="btn g ${t[0]===tab?'on':''}" onclick="tab='${t[0]}';render()">${t[1]}</button>`).join('')}</div>
 <div id="v"></div>`;
 ({players:vPlayers,vault:vVault,roles:vRoles,log:vLog,shop:vShop,xch:vXch,pay:vPay,rst:vRst,mon:vMon,trade:vTrade})[(tab==='trade'&&!(seeAll()&&TW.includes(world)))||(tab==='mon'&&!(world==='kingdom'&&['monsterCtl','owner','deputyOwner'].includes(kind())))||(tab==='roles'&&!['owner','deputyOwner','king'].includes(kind()))||(world==='sys'&&!['players','log','xch','pay','rst'].includes(tab))||(world==='kingdom'&&['vault','xch','pay','rst'].includes(tab))?'players':tab]();askProfile();
}
function setup(){const c=$('c').value.trim();if(c.length<4)return toast('الكود قصير جداً');S.roles.owner=c;sess='owner';localStorage.setItem('og_s',sess);save();render()}
function login(){const c=$('c').value.trim();const k=Object.keys(S.roles).find(k=>S.roles[k]===c);if(k){sess=k;try{localStorage.setItem('og_s',k);localStorage.removeItem('og_p')}catch(e){}return render()}
 const p=S.players.find(x=>x.pid&&x.pid.toUpperCase()===c.toUpperCase());if(!p)return toast('كود أو معرّف غير صحيح');
 plid=p.id;sess='player:'+p.world;try{localStorage.setItem('og_s',sess);localStorage.setItem('og_p',plid)}catch(e){}render()}
function logout(){sess=null;localStorage.removeItem('og_s');localStorage.removeItem('og_p');plid=null;profAsked=false;render()}

function vPlayers(){
 const L=wp();
 const sp=L.find(x=>x.id===selP);$('v').innerHTML=(world==='kingdom'&&kind()!=='king'&&kind()!=='player'?`<select onchange="kSec=this.value;render()"><option value="">🏰 كل الأقسام</option>${Object.keys(W).filter(k=>k!=='kingdom').map(k=>`<option value="${k}" ${kSec===k?'selected':''}>${W[k].i} ${W[k].n}</option>`).join('')}</select>`:'')+`<select ${kind()==='player'?'hidden':''} onchange="selP=this.value;render()"><option value="">👥 كل اللاعبين (${L.length})</option>${L.map(x=>`<option value="${x.id}" ${sp&&sp.id===x.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select>`+(canEdit()?`${world!=='kingdom'?'<button class="btn" onclick="editP()">➕ لاعب جديد</button> ':''}<button class="btn g" onclick="bulk()">👥 عملية جماعية</button> ${world!=='kingdom'?'<button class="btn g" onclick="importTG()">📥 استيراد من تيليجرام</button> <button class="btn g" onclick="importRec()">📖 استيراد سجلات القدرات</button>':''}`:'')+`<div class="grid" style="margin-top:12px">`+((sp?[sp]:L).map(p=>`<div class="card"><h3>🔰 ${esc(p.name)} 🔰${p.traveling?' <span class="badge">(مسافر)</span>':''}${p.origin&&W[p.origin]?` <span class="badge">${W[p.origin].i} ${W[p.origin].n}</span>`:''}</h3>
 <div class="row"><span>الفئة</span><b>${esc(p.cat||'—')}</b></div>
 <div class="row"><span>اللفل 🆙</span><b>${String(p.level).padStart(2,'0')}</b></div>
 <div class="row"><span>الاكس بي</span><b>${fmt(p.xp)}/${fmt(p.level*1000)} Xp</b></div><div class="bar"><i style="width:${Math.min(100,p.xp/(p.level*1000)*100)}%"></i></div>
 ${Object.keys(C).map(k=>`<div class="row"><span>${C[k][0]}</span><b style="${p[k]<0?'color:var(--red)':''}">${fmt(p[k])} ${C[k][1]}</b></div>`).join('')}
 ${canEdit()?`<div class="row"><span>🆔 المعرّف</span><b class="code" onclick="cp('${p.pid}')" style="cursor:pointer">${p.pid||'—'}</b></div>`:''}<div class="acts"><button class="btn g s" onclick="selP='${p.id}';render()">📖 القدرات</button>${canEdit()?`<button class="btn s" onclick="adj('${p.id}')">± رصيد</button><button class="btn g s" onclick="setBal('${p.id}')">✍️ ضبط الأرصدة</button>${((S.undo.pl||{})[p.id]||[]).length?`<button class="btn g s" onclick="undoP('${p.id}')">↩️ تراجع</button>`:''}<button class="btn g s" onclick="editP('${p.id}')">✏️ تعديل</button>${canTravel()?`<button class="btn g s" onclick="trav('${p.id}')">${p.traveling?'🏠 إنهاء السفر':'✈️ سفر'}</button>`:''}${canTravel()&&p.traveling?`<button class="btn g s" onclick="lodge('${p.id}')">🛏️ المبيت</button>`:''}${canDel()?`<button class="btn r s" onclick="delP('${p.id}')">🗑</button>`:''}`:''}</div></div>`).join('')||'<p class="mu">لا يوجد لاعبون في هذا العالم بعد.</p>')+`</div>`+(sp?recBox(sp):'');
}
function editP(id){
 const p=S.players.find(x=>x.id===id)||{name:'',level:1,xp:0,xpMax:100};
 modal(id?'تعديل لاعب':'لاعب جديد',`<label>الاسم</label><input id="a" value="${esc(p.name)}"><label>اللفل</label><input id="b" type="number" value="${p.level}"><label>الاكس بي الحالي (المطلوب للترقية: اللفل × 1000)</label><input id="d" type="number" value="${p.xp}"><label>الفئة</label><select id="f">${['هجومي','متوازن','دفاعي'].map(c=>`<option ${c===(p.cat||'متوازن')?'selected':''}>${c}</option>`).join('')}</select>`,'حفظ',()=>{
  const n=$('a').value.trim();if(!n)return toast('أدخل الاسم');
  const lv=Math.max(1,Math.floor(+$('b').value)||1);const o={name:n,cat:$('f').value,level:lv,xp:Math.min(Math.max(0,+$('d').value||0),lv*1000-1)};
  if(id){Object.assign(p,o);addLog(world,'تعديل بيانات اللاعب '+n)}else{S.players.push({id:'p'+Date.now(),pid:newPid(),world,coins:0,gems:0,gp:0,usd:0,...o});addLog(world,'إضافة لاعب جديد: '+n)}
  save();closeM();render()});
}
function delP(id){const p=S.players.find(x=>x.id===id);if(p.staff)return toast('هذا سجل رتبة ولا يُحذف');modal('حذف لاعب',`<p>حذف سجل <b>${esc(p.name)}</b> نهائياً؟</p>`,'حذف',()=>{S.players=S.players.filter(x=>x.id!==id);addLog(world,'حذف اللاعب '+p.name);save();closeM();render()})}
function adj(id){
 const p=S.players.find(x=>x.id===id);
 modal('رصيد '+esc(p.name),`<label>العملة</label><select id="a">${Object.keys(C).map(k=>`<option value="${k}">${C[k][1]} ${C[k][0]}</option>`).join('')}<option value="xp">✨ الاكس بي (XP)</option></select><label>العملية</label><select id="b"><option value="1">إضافة</option><option value="-1">خصم</option></select><label>المبلغ</label><input id="d" type="number" step="any" min="0"><label>السبب</label><input id="e">`,'تنفيذ',()=>{
  const k=$('a').value,s=+$('b').value,v=+$('d').value;
  if(!(v>0))return toast('أدخل مبلغاً صحيحاً');
  if(p[k]+s*v<0)return toast('الرصيد لا يكفي');
  p[k]+=s*v;let up=0,l0=p.level;if(k==='xp'){while(p.xp>=p.level*1000){p.xp-=p.level*1000;p.level++}up=p.level-l0}addLog(world,`${s>0?'إضافة':'خصم'} ${fmt(v)} ${k==='xp'?'XP':C[k][0]} ${s>0?'إلى':'من'} ${p.name}${$('e').value?' — '+$('e').value:''}${up?' (ترقية من لفل '+l0+' إلى لفل '+p.level+')':''}`);if(up)toast('🆙 ترقية إلى لفل '+p.level);
  save();closeM();render();if(!up)toast('تمت العملية')});
}

const ORD=['الأول','الثاني','الثالث','الرابع','الخامس','السادس','السابع','الثامن','التاسع','العاشر'];
const lines=t=>t.split('\n').map(x=>x.trim()).filter(Boolean);
let curRec='';
function getRec(p){if(!p.rec)p.rec={awak:0,pack:'',ab:'',bass:'',res:[],comps:[],gear:[],seasons:[{great:[],real:[],special:[]},{great:[],real:[],special:[]}]};return p.rec}
function recText(p){

 <label>${sell?'العالم المشتري':'العالم الآخر'}</label><select id="tw" onchange="trTo=this.value;vTrade()">${others.map(w=>`<option value="${w}" ${w===trTo?'selected':''}>${W[w].i} ${W[w].n}</option>`).join('')}</select>
 <label>${sell?'اللاعب المباع':'لاعب'} من ${W[world].i} ${W[world].n}</label>${A.length?`<select id="ta">${opt(A)}</select>`:'<p class="mu">لا يوجد لاعبون متاحون.</p>'}
 ${sell?`<label>السعر</label><div style="display:flex;gap:8px"><input id="tv" type="number" min="0" step="any"><select id="tc">${K.map(k=>`<option value="${k}">${C[k][1]} ${C[k][0]}</option>`).join('')}</select></div><p class="mu">يُخصم السعر من خزنة ${W[trTo].n} ويُضاف إلى خزنة ${W[world].n}.</p>`
 :`<label>لاعب من ${W[trTo].i} ${W[trTo].n}</label>${B.length?`<select id="tb">${opt(B)}</select>`:'<p class="mu">لا يوجد لاعبون متاحون.</p>'}`}
 <button class="btn" onclick="tradeGo()">تنفيذ</button></div>`;
 $('tm').value=trMode;
}
function tradeGo(){
 if(!seeAll()||!TW.includes(world)||!TW.includes(trTo)||trTo===world)return;
 const w1=world,w2=trTo,n1=W[w1].n,n2=W[w2].n,a=$('ta')&&S.players.find(x=>x.id===$('ta').value);
 if(!a||a.world!==w1||a.staff||a.traveling)return toast('اختر لاعباً صالحاً');
 if(trMode==='swap'){
  const b=$('tb')&&S.players.find(x=>x.id===$('tb').value);
  if(!b||b.world!==w2||b.staff||b.traveling)return toast('اختر اللاعب الآخر');
  modal('🔁 تأكيد التبادل',`<p>تبادل <b>${esc(a.name)}</b> (${n1}) مع <b>${esc(b.name)}</b> (${n2})؟</p>`,'تأكيد',()=>{
   a.world=w2;b.world=w1;
   finishTrade(w1,w2,`🔁 تبادل لاعبين: انتقل ${a.name} من ${n1} إلى ${n2}، وانتقل ${b.name} من ${n2} إلى ${n1}`)});
 }else{
  const v=+$('tv').value,k=$('tc').value;
  if(!(v>0))return toast('أدخل سعراً صحيحاً');if(!K.includes(k))return;
  if(S.vaults[w2][k]<v)return toast('خزنة عالم '+n2+' لا تكفي ('+fmt(S.vaults[w2][k])+' '+C[k][1]+')');
  modal('💰 تأكيد البيع',`<p>بيع <b>${esc(a.name)}</b> من ${n1} إلى ${n2} بسعر <b>${fmt(v)} ${C[k][1]}</b>؟</p><p class="mu">يُخصم المبلغ من خزنة ${n2} ويُضاف إلى خزنة ${n1}.</p>`,'تأكيد',()=>{
   if(S.vaults[w2][k]<v)return toast('خزنة عالم '+n2+' لا تكفي');
   S.vaults[w2][k]-=v;S.vaults[w1][k]+=v;a.world=w2;
   finishTrade(w1,w2,`💰 بيع لاعب: بيع ${a.name} من ${n1} إلى ${n2} بسعر ${fmt(v)} ${C[k][0]} (خُصم من خزنة ${n2} وأُضيف إلى خزنة ${n1})`)});
 }
}
function finishTrade(w1,w2,txt){
 const t=new Date().toLocaleString('ar-EG'),by=label(sess);
 [w1,w2].forEach(w=>S.log.unshift({t,w,by,s:txt}));capLog();
 S.undo[w1]=[];S.undo[w2]=[];
 noPush=true;save();noPush=false;closeM();render();toast('تمت العملية');
}
function vLog(){
 const L=S.log.filter(l=>seeAll()?(l.w===world||l.w==='all'):(l.w===world&&(world!=='kingdom'||kind()!=='king'||l.o===wd())));
 $('v').innerHTML=L.map(l=>`<div class="card"><div>${esc(l.s)}</div><div class="mu">${esc(l.by)} · ${esc(l.t)}</div></div>`).join('')||'<p class="mu">لا توجد عمليات بعد.</p>';
}

function chOwner(){
 modal('\ud83d\udd11 \u062a\u063a\u064a\u064a\u0631 \u0643\u0648\u062f \u0635\u0627\u062d\u0628 \u0627\u0644\u0646\u0638\u0627\u0645',`<p class="mu">\u0627\u0644\u0643\u0648\u062f \u0627\u0644\u062c\u062f\u064a\u062f \u0647\u0648 \u0627\u0644\u0630\u064a \u0633\u064a\u062f\u062e\u0644 \u0628\u0647 \u0635\u0627\u062d\u0628 \u0627\u0644\u0646\u0638\u0627\u0645\u060c \u0648\u064a\u062e\u0631\u062c \u0627\u0644\u0643\u0648\u062f \u0627\u0644\u062d\u0627\u0644\u064a \u0645\u0646 \u0627\u0644\u062e\u062f\u0645\u0629.</p><label>\u0627\u0644\u0643\u0648\u062f \u0627\u0644\u062c\u062f\u064a\u062f</label><input id="oc" type="text">`,'\u062a\u063a\u064a\u064a\u0631',()=>{
  const c=$('oc').value.trim();if(c.length<4)return toast('\u0627\u0644\u0643\u0648\u062f \u0642\u0635\u064a\u0631 \u062c\u062f\u0627\u064b');
  if(Object.keys(S.roles).some(k=>k!=='owner'&&S.roles[k]===c))return toast('\u0647\u0630\u0627 \u0627\u0644\u0643\u0648\u062f \u0645\u0633\u062a\u062e\u062f\u0645');
  S.roles.owner=c;addLog('all','\u062a\u063a\u064a\u064a\u0631 \u0643\u0648\u062f \u0635\u0627\u062d\u0628 \u0627\u0644\u0646\u0638\u0627\u0645');closeM();logout();
 });
}
// ===== المزامنة السحابية (Firebase) + النسخ الاحتياطي =====
let cloud=null,pushT=null,lastRemote='',cloudReady=false,cloudStatus='';
function setCS(t){cloudStatus=t;const e=$('cs');if(e)e.textContent=t}
function cloudPart(){const c={...S};delete c.undo;return JSON.stringify(c)}
function cloudPush(){if(!cloud||!cloudReady)return;clearTimeout(pushT);pushT=setTimeout(()=>{pushT=null;const j=cloudPart();lastRemote=j;cloud.set({json:j,t:Date.now()}).then(()=>setCS('\u2601\ufe0f \u0645\u062a\u0635\u0644')).catch(e=>{console.error(e);setCS('\u26a0\ufe0f \u0641\u0634\u0644 \u0627\u0644\u062d\u0641\u0638 \u0641\u064a \u0627\u0644\u0633\u062d\u0627\u0628\u0629: '+(e.code||e.message));toast('\u26a0\ufe0f \u0644\u0645 \u064a\u064f\u062d\u0641\u0638 \u0641\u064a \u0627\u0644\u0633\u062d\u0627\u0628\u0629')})},400)}
function fixS(){S.undo=S.undo||{};S.undo.pl=S.undo.pl||{};['hell','demons','magic','sys','kingdom'].forEach(w=>{S.undo[w]=S.undo[w]||[]});S.vaults.sys=S.vaults.sys||{coins:0,gems:0,gp:0};S.vaults.kingdom=S.vaults.kingdom||{coins:0,gems:0,gp:0};S.dests=S.dests||[{n:'\u0627\u0644\u0645\u0645\u0644\u0643\u0629',price:10000}]}
function safeRender(){if($('m').style.display==='flex'||/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)){setTimeout(safeRender,2500);return}render()}
function applyRemote(j){const u=S.undo;S=JSON.parse(j);S.undo=u;fixS();snap();try{localStorage.setItem('og_data',JSON.stringify(S))}catch(e){}safeRender();lodgeTick()}
function backup(){const b=new Blob([cloudPart()],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='origins-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click()}
function restore(f){if(!f)return;const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);if(!o.roles||!o.players)throw 0;const u=S.undo;S=o;S.undo=u;fixS();snap();save();render();toast('\u062a\u0645\u062a \u0627\u0644\u0627\u0633\u062a\u0639\u0627\u062f\u0629')}catch(e){toast('\u0645\u0644\u0641 \u063a\u064a\u0631 \u0635\u0627\u0644\u062d')}};r.readAsText(f)}
if(window.firebase&&window.FIREBASE_CONFIG&&FIREBASE_CONFIG.apiKey){
 try{
  firebase.initializeApp(FIREBASE_CONFIG);
  const ref=firebase.firestore().collection('app').doc('state');
  cloudStatus='\u23f3 \u062c\u0627\u0631\u064d \u0627\u0644\u0627\u062a\u0635\u0627\u0644 \u0628\u0627\u0644\u0633\u062d\u0627\u0628\u0629...';
  ref.onSnapshot(sn=>{
   if(sn.metadata.fromCache&&!cloudReady&&!sn.exists)return;
   setCS('\u2601\ufe0f \u0645\u062a\u0635\u0644');
   if(sn.metadata.hasPendingWrites||pushT)return;
   if(!sn.exists){
    if(!cloudReady){cloudReady=true;S={roles:{},players:[],vaults:{hell:{coins:0,gems:0,gp:0},demons:{coins:0,gems:0,gp:0},magic:{coins:0,gems:0,gp:0}},log:[],undo:S.undo};fixS();snap();render()}
    return}
   const j=sn.data().json;cloudReady=true;if(lastRemote&&j===lastRemote)return;lastRemote=j;applyRemote(j)
  },e=>{console.error(e);setCS('\u26a0\ufe0f \u062e\u0637\u0623 \u0641\u064a \u0627\u0644\u0627\u062a\u0635\u0627\u0644: '+(e.code||e.message)+' \u2014 \u062a\u062d\u0642\u0642 \u0645\u0646 \u0646\u0634\u0631 \u0627\u0644\u0642\u0648\u0627\u0639\u062f \u0648\u0635\u062d\u0629 \u0625\u0639\u062f\u0627\u062f\u0627\u062a Firebase');render()});
  cloud=ref;
 }catch(e){console.error(e);cloudStatus='\u26a0\ufe0f \u062e\u0637\u0623: '+e.message}
}
if(!cloud&&!cloudStatus)cloudStatus='\u26a0\ufe0f \u0648\u0636\u0639 \u0645\u062d\u0644\u064a: \u0625\u0639\u062f\u0627\u062f\u0627\u062a Firebase \u063a\u064a\u0631 \u0645\u0643\u062a\u0645\u0644\u0629';
lodgeTick();render();
</script>
